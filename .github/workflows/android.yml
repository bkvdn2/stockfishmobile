name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: Build Stockfish and fetch NNUE
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358 bash scripts/build_stockfish.sh
      - name: Host Stockfish for integration tests
        run: |
          cd third_party/stockfish-src/src
          make -j4 build ARCH=x86-64-sse41-popcnt EXTRACXXFLAGS=-DNNUE_EMBEDDING_OFF
          cp stockfish "$RUNNER_TEMP/stockfish-host"
          make clean
      - name: Unit tests
        run: |
          export SF_HOST_BINARY=$RUNNER_TEMP/stockfish-host
          export SF_NNUE=$(ls $PWD/app/src/main/assets/nnue/*.nnue)
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: stockfish-analyzer-apk
          path: app/build/outputs/apk/release/app-release.apk
